# hyprlock config (doom-one). Syntax from /usr/share/hypr/hyprlock.conf.
general {
    hide_cursor = true
}

background {
    monitor =
    color = rgb(282c34)
    blur_passes = 0
}

input-field {
    monitor =
    size = 240, 40
    outline_thickness = 2
    inner_color = rgb(282c34)
    outer_color = rgb(51afef)
    check_color = rgb(98be65)
    fail_color = rgb(ff6c6b)
    font_color = rgb(bbc2cf)
    fade_on_empty = false
    rounding = 0
    font_family = Monospace
    placeholder_text = <i>password</i>
    fail_text = <i>$PAMFAIL</i>
    position = 0, -20
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgb(bbc2cf)
    font_size = 90
    font_family = Monospace
    position = 0, 160
    halign = center
    valign = center
}
